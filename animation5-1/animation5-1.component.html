<div class="container">
    <div class="pendulum" #pendulum>
        <div class="string"></div>
        <div class="bob"></div>
    </div>
    <button (click)="movependulum()">Move</button>
    <label>Position<input type="range" min="-60" max="60" step="5" [(ngModel)]="p"></label>
    <label>Kinetic Energy: {{ke | number:'1.0-2'}}</label>
    <label>Potential Energy: {{pe | number:'1.0-2'}}</label>
</div>
